<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Messages ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Arial,Helvetica,sans-serif;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%}

.message-container{
 position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
 pointer-events:none;z-index:5
}
.message{
 position:absolute;color:#e9f5ff;font-size:clamp(20px,4vw,34px);
 font-weight:500;text-align:center;text-shadow:0 0 5px #fff,0 0 12px #8ecaff,0 0 25px #408cff;
 opacity:0;transform:scale(.5);transition:opacity 1s ease,transform 1s ease
}
.message.show{opacity:1;transform:scale(1)}

.hint{
 position:fixed;bottom:22px;left:0;right:0;text-align:center;
 color:rgba(255,255,255,.75);font-family:Georgia,serif;font-style:italic;
 font-size:15px;text-shadow:0 0 8px #8bcaff;z-index:10;pointer-events:none;
 animation:hintGlow 2s infinite alternate
}
@keyframes hintGlow{from{opacity:.45}to{opacity:1}}

.loading{
 position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
 background:#000;color:white;z-index:100;transition:opacity 1.5s ease
}
.loading.hide{opacity:0;pointer-events:none}
.loading-text{text-align:center}
.loading-heart{font-size:55px;animation:loadingBeat 1s infinite;text-shadow:0 0 15px #4ca6ff,0 0 35px #287cff}
.loading p{margin-top:15px;color:#b9dcff;font-size:14px}
@keyframes loadingBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<div class="loading" id="loading">
  <div class="loading-text">
    <div class="loading-heart">♥</div>
    <p>Loading something special...</p>
  </div>
</div>

<div class="message-container">
  <div class="message" id="message"></div>
</div>

<div class="hint">Click anywhere to send heart</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const messageElement=document.getElementById("message");
const loading=document.getElementById("loading");

const messages=[
 "I Love You",
 "Forever Yours",
 "I Dreamed About You",
 "My Love",
 "You Are Special",
 "You Make Me Smile",
 "Always In My Heart"
];

let W,H,dpr;

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 W=window.innerWidth; H=window.innerHeight;
 canvas.width=W*dpr; canvas.height=H*dpr;
 canvas.style.width=W+"px"; canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener("resize",resize);

class Particle{
 constructor(x,y,tx,ty){
  this.x=x;this.y=y;this.tx=tx;this.ty=ty;
  this.vx=(Math.random()-.5)*2;this.vy=(Math.random()-.5)*2;
  this.size=Math.random()*2.2+.6;
  this.alpha=1;this.life=100+Math.random()*100;this.maxLife=this.life;
  this.color=Math.random()>.72?"#ffffff":Math.random()>.5?"#5fa8ff":"#89c8ff";
  this.speed=.025+Math.random()*.035;
 }
 update(){
  this.x+=(this.tx-this.x)*this.speed;
  this.y+=(this.ty-this.y)*this.speed;
  this.x+=Math.sin(Date.now()*.001+this.x)*.08;
  this.y+=Math.cos(Date.now()*.001+this.y)*.08;
  this.life-=.4;
  this.alpha=Math.max(0,this.life/this.maxLife);
 }
 draw(){
  ctx.save();ctx.globalAlpha=this.alpha;ctx.fillStyle=this.color;
  ctx.shadowBlur=10;ctx.shadowColor=this.color;
  ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();
 }
}

class FireworkParticle{
 constructor(x,y){
  this.x=x;this.y=y;
  const angle=Math.random()*Math.PI*2,speed=Math.random()*5+1;
  this.vx=Math.cos(angle)*speed;this.vy=Math.sin(angle)*speed;
  this.life=40+Math.random()*50;this.size=Math.random()*2+.5;
  this.color=Math.random()>.5?"#5fa8ff":"#ffffff";
 }
 update(){this.x+=this.vx;this.y+=this.vy;this.vx*=.98;this.vy*=.98;this.vy+=.025;this.life--}
 draw(){
  ctx.save();ctx.globalAlpha=this.life/80;ctx.fillStyle=this.color;
  ctx.shadowBlur=15;ctx.shadowColor=this.color;
  ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();
 }
}

class HeartParticle{
 constructor(x,y){
  this.x=x;this.y=y;this.vx=(Math.random()-.5)*2;
  this.vy=-(Math.random()*3+1);this.gravity=.025;
  this.life=80+Math.random()*60;this.size=Math.random()*2+1;
  this.color=Math.random()>.5?"#62aaff":"#ffffff";
 }
 update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;this.life--}
 draw(){
  ctx.save();ctx.globalAlpha=Math.max(0,this.life/130);ctx.fillStyle=this.color;
  ctx.shadowBlur=15;ctx.shadowColor=this.color;
  ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();
 }
}

let particles=[],fireworks=[],heartParticles=[];

function heartPosition(t,scale){
 const x=16*Math.pow(Math.sin(t),3);
 const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
 return {x:W/2+x*scale,y:H/2+y*scale};
}

function createHeart(centerX=W/2,centerY=H/2,scale=Math.min(W,H)*.014){
 particles=[];
 const amount=500;
 for(let i=0;i<amount;i++){
  const t=Math.random()*Math.PI*2,pos=heartPosition(t,scale);
  const tx=pos.x+(Math.random()-.5)*5,ty=pos.y+(Math.random()-.5)*5;
  const startX=centerX+(Math.random()-.5)*W,startY=centerY+(Math.random()-.5)*H;
  particles.push(new Particle(startX,startY,tx,ty));
 }
}

function createFirework(x,y){
 for(let i=0;i<80;i++) fireworks.push(new FireworkParticle(x,y));
}

function heartBurst(x,y){
 for(let i=0;i<35;i++) heartParticles.push(new HeartParticle(x,y));
 createFirework(x,y);
}

let messageIndex=0;

function showMessage(){
 messageElement.classList.remove("show");
 setTimeout(()=>{
  messageElement.textContent=messages[messageIndex];
  messageElement.classList.add("show");
  messageIndex=(messageIndex+1)%messages.length;
 },700);
}

function messageLoop(){
 showMessage();
 setTimeout(messageLoop,3500);
}

const stars=[];
for(let i=0;i<160;i++){
 stars.push({
  x:Math.random()*W,y:Math.random()*H,size:Math.random()*1.5,
  alpha:Math.random(),speed:Math.random()*.01
 });
}

function drawStars(){
 for(const star of stars){
  star.alpha+=star.speed;
  const a=.35+Math.sin(star.alpha)*.35;
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(star.x,star.y,star.size,0,Math.PI*2);ctx.fill();ctx.restore();
 }
}

function animate(){
 requestAnimationFrame(animate);
 ctx.fillStyle="rgba(0,0,8,.25)";
 ctx.fillRect(0,0,W,H);
 drawStars();

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.update();p.draw();
  if(p.life<=0) particles.splice(i,1);
 }

 for(let i=fireworks.length-1;i>=0;i--){
  const p=fireworks[i];p.update();p.draw();
  if(p.life<=0) fireworks.splice(i,1);
 }

 for(let i=heartParticles.length-1;i>=0;i--){
  const p=heartParticles[i];p.update();p.draw();
  if(p.life<=0) heartParticles.splice(i,1);
 }
}

canvas.addEventListener("click",e=>{
 heartBurst(e.clientX,e.clientY);
 createHeart(e.clientX,e.clientY,Math.min(W,H)*.009);
});

canvas.addEventListener("touchstart",e=>{
 const touch=e.touches[0];
 heartBurst(touch.clientX,touch.clientY);
 createHeart(touch.clientX,touch.clientY,Math.min(W,H)*.009);
},{passive:true});

setTimeout(()=>{
 loading.classList.add("hide");
 createHeart();
 setTimeout(()=>createFirework(W/2,H/2),500);
 setTimeout(messageLoop,1200);
},1800);

animate();
</script>
</body>
</html>
