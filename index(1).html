<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apa yang kamu lakukan di sini mpruy</title>
<style>
  :root {
    --bg: #11151c;
    --ink: #eef1f6;
    --ink-dim: #8b94a3;
    --accent: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }
  main {
    max-width: 620px;
    text-align: center;
    position: relative;
  }
  .tag {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(32px, 7vw, 56px);
    line-height: 1.15;
    margin: 0 0 28px 0;
    cursor: pointer;
    user-select: none;
    position: relative;
    display: inline-block;
  }
  h1 .char {
    display: inline-block;
    transition: transform 0.4s ease, color 0.4s ease;
  }
  p.sub {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink-dim);
    font-size: 15px;
    margin: 0;
  }
  .hint {
    margin-top: 40px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    color: var(--ink-dim);
    opacity: 0.7;
  }
  .burst {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    pointer-events: none;
    top: 50%;
    left: 50%;
  }
  @media (prefers-reduced-motion: reduce) {
    h1 .char { transition: none; }
  }
</style>
</head>
<body>

  <main>
    <div class="tag">Apa yang kamu lakukan di sini mpruy</div>
    <h1 id="headline">Apa yang kamu lakukan di sini mpruy</h1>
    <p class="sub" id="subline">Klik itu.</p>
    <div class="hint">coba klik berkali-kali</div>
  </main>

<script>
  const messages = [
    "whoooo",
    "klik lagi",
    "klik trus",
    "sehat?",
    "dah ah capek"
  ];
  let index = 0;

  const headline = document.getElementById('headline');
  const subline = document.getElementById('subline');

  function renderText(text) {
    headline.innerHTML = '';
    [...text].forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.transitionDelay = (i * 18) + 'ms';
      headline.appendChild(span);
    });
  }

  function scrambleThenSettle(text) {
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
    const chars = headline.querySelectorAll('.char');
    chars.forEach((span, i) => {
      span.style.color = 'var(--accent)';
      span.style.transform = `translateY(${(Math.random() - 0.5) * 40}px) rotate(${(Math.random() - 0.5) * 50}deg)`;
      let ticks = 0;
      const original = text[i];
      const interval = setInterval(() => {
        ticks++;
        if (original === ' ') {
          span.textContent = '\u00A0';
        } else {
          span.textContent = letters[Math.floor(Math.random() * letters.length)];
        }
        if (ticks > 6) {
          clearInterval(interval);
          span.textContent = original === ' ' ? '\u00A0' : original;
          span.style.transform = 'translateY(0) rotate(0deg)';
          span.style.color = 'var(--ink)';
        }
      }, 35);
    });
  }

  function burstAt(x, y) {
    for (let i = 0; i < 14; i++) {
      const dot = document.createElement('div');
      dot.className = 'burst';
      document.querySelector('main').appendChild(dot);
      const angle = (Math.PI * 2 * i) / 14;
      const dist = 60 + Math.random() * 40;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';
      dot.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
        { transform: `translate(${dx - 50}%, ${dy - 50}%) scale(0)`, opacity: 0 }
      ], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)' });
      setTimeout(() => dot.remove(), 650);
    }
  }

  function nextMessage(e) {
    index = (index + 1) % messages.length;
    scrambleThenSettle(messages[index]);
    subline.textContent = index === messages.length - 1
      ? "selesai, klik lagi buat ulang"
      : "klik lagi untuk lihat yang lain";

    const rect = headline.getBoundingClientRect();
    const mainRect = document.querySelector('main').getBoundingClientRect();
    const x = (e ? e.clientX : rect.left + rect.width / 2) - mainRect.left;
    const y = (e ? e.clientY : rect.top + rect.height / 2) - mainRect.top;
    burstAt(x, y);
  }

  renderText(messages[0]);
  headline.addEventListener('click', nextMessage);
</script>

</body>
</html>
